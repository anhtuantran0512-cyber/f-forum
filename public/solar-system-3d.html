<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mô Phỏng Hệ Mặt Trời 3D · CLB Thiên Văn F-Forum</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070d;
      color: #FBF2E1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    #canvas3d {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    #canvas3d:active {
      cursor: grabbing;
    }
    .hud-header {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      pointer-events: none;
    }
    .hud-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #f2cc8f;
      display: flex;
      align-items: center;
      gap: 8px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }
    .hud-badge {
      display: inline-block;
      padding: 2px 6px;
      font-size: 10px;
      font-weight: 700;
      background: rgba(99, 102, 241, 0.25);
      border: 1px solid rgba(129, 140, 248, 0.5);
      border-radius: 6px;
      color: #a5b4fc;
    }
    .hud-sub {
      font-size: 11px;
      color: rgba(244, 241, 222, 0.7);
      margin-top: 3px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    }
    .hud-controls {
      position: absolute;
      bottom: 16px;
      left: 16px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(17, 21, 29, 0.85);
      border: 1.5px solid rgba(244, 241, 222, 0.16);
      padding: 6px 10px;
      border-radius: 14px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .hud-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #FBF2E1;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .hud-btn:hover {
      background: rgba(242, 204, 143, 0.2);
      border-color: #f2cc8f;
      color: #f2cc8f;
    }
    .hud-btn.active {
      background: #f2cc8f;
      color: #2B2331;
      border-color: #f2cc8f;
    }
    .info-card {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 10;
      width: 260px;
      background: rgba(17, 21, 29, 0.9);
      border: 1.5px solid rgba(244, 241, 222, 0.2);
      padding: 14px;
      border-radius: 16px;
      backdrop-filter: blur(14px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.6);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .info-planet-name {
      font-size: 16px;
      font-weight: 800;
      color: #f2cc8f;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .info-planet-type {
      font-size: 11px;
      color: rgba(244, 241, 222, 0.6);
      margin-top: 2px;
      margin-bottom: 8px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      padding: 4px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .info-label {
      color: rgba(244, 241, 222, 0.65);
    }
    .info-val {
      font-weight: 600;
      color: #fff;
    }
    .planet-nav {
      position: absolute;
      bottom: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      gap: 4px;
      overflow-x: auto;
      max-width: calc(100vw - 32px);
      background: rgba(17, 21, 29, 0.85);
      border: 1.5px solid rgba(244, 241, 222, 0.16);
      padding: 4px;
      border-radius: 12px;
      backdrop-filter: blur(12px);
    }
    .planet-pill {
      background: transparent;
      border: none;
      color: rgba(244, 241, 222, 0.7);
      padding: 5px 8px;
      font-size: 10.5px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .planet-pill:hover, .planet-pill.active {
      background: rgba(242, 204, 143, 0.2);
      color: #f2cc8f;
    }
    @media (max-width: 640px) {
      .info-card {
        top: auto;
        bottom: 64px;
        right: 16px;
        left: 16px;
        width: auto;
      }
      .planet-nav {
        bottom: 12px;
        right: 12px;
        left: 12px;
      }
      .hud-controls {
        bottom: 60px;
        left: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="hud-header">
    <div class="hud-title">
      <span>Trạm Khám Phá Thiên Văn 3D</span>
      <span class="hud-badge">Vật Lý Vũ Trụ</span>
    </div>
    <div class="hud-sub">Mô phỏng động học quỹ đạo Hệ Mặt Trời · F-Forum CLB Thiên Văn</div>
  </div>

  <div class="hud-controls">
    <button type="button" id="btnPlayPause" class="hud-btn">Tạm dừng</button>
    <button type="button" id="btnSpeed" class="hud-btn">Tốc độ: 1x</button>
    <button type="button" id="btnResetView" class="hud-btn">Góc nhìn chuẩn</button>
    <button type="button" id="btnToggleOrbits" class="hud-btn active">Quỹ đạo: Bật</button>
  </div>

  <div id="infoCard" class="info-card">
    <div class="info-planet-name">
      <span id="infoName">Mặt Trời</span>
      <span id="infoSymbol" style="font-size:18px;">☀️</span>
    </div>
    <div id="infoType" class="info-planet-type">Ngôi sao trung tâm · Hệ Mặt Trời</div>
    <div class="info-row">
      <span class="info-label">Đường kính</span>
      <span id="infoDiameter" class="info-val">1.392.700 km</span>
    </div>
    <div class="info-row">
      <span class="info-label">Khoảng cách</span>
      <span id="infoDist" class="info-val">0 AU (Tâm hệ)</span>
    </div>
    <div class="info-row">
      <span class="info-label">Chu kỳ quỹ đạo</span>
      <span id="infoPeriod" class="info-val">225 triệu năm</span>
    </div>
    <div class="info-row">
      <span class="info-label">Vệ tinh tự nhiên</span>
      <span id="infoMoons" class="info-val">8 hành tinh chính</span>
    </div>
  </div>

  <div class="planet-nav" id="planetNav"></div>

  <canvas id="canvas3d"></canvas>

  <script>
    (function() {
      var canvas = document.getElementById('canvas3d');
      var ctx = canvas.getContext('2d');

      var planets = [
        { name: 'Mặt Trời', symbol: '☀️', type: 'Ngôi sao mẹ loại G2V', color: '#ffaa00', glow: '#ff5500', r: 24, dist: 0, speed: 0, diameter: '1.392.700 km', distAu: '0 AU (Tâm hệ)', period: '225 triệu năm (Quanh tâm Ngân Hà)', moons: '8 hành tinh & vành đai Kuiper' },
        { name: 'Sao Thủy', symbol: '☿', type: 'Hành tinh đất đá', color: '#a0a0a0', glow: '#707070', r: 5, dist: 58, speed: 4.15, diameter: '4.879 km', distAu: '0.39 AU', period: '88 ngày Trái Đất', moons: '0 vệ tinh' },
        { name: 'Sao Kim', symbol: '♀', type: 'Hành tinh đất đá khí quyển CO2', color: '#e8b878', glow: '#d4883b', r: 8, dist: 85, speed: 1.62, diameter: '12.104 km', distAu: '0.72 AU', period: '224,7 ngày Trái Đất', moons: '0 vệ tinh' },
        { name: 'Trái Đất', symbol: '🜨', type: 'Hành tinh sự sống & nước lỏng', color: '#38bdf8', glow: '#2563eb', r: 9, dist: 122, speed: 1.0, hasMoon: true, diameter: '12.742 km', distAu: '1.00 AU (149.6 triệu km)', period: '365,25 ngày Trái Đất', moons: '1 vệ tinh (Mặt Trăng)' },
        { name: 'Sao Hỏa', symbol: '♂', type: 'Hành tinh Đỏ (Oxide sắt)', color: '#ef4444', glow: '#991b1b', r: 6.5, dist: 160, speed: 0.53, diameter: '6.779 km', distAu: '1.52 AU', period: '687 ngày Trái Đất', moons: '2 vệ tinh (Phobos, Deimos)' },
        { name: 'Sao Mộc', symbol: '♃', type: 'Hành tinh khí khổng lồ', color: '#f59e0b', glow: '#d97706', r: 17, dist: 220, speed: 0.084, hasBands: true, diameter: '139.820 km', distAu: '5.20 AU', period: '11,86 năm Trái Đất', moons: '95 vệ tinh (Ganymede, Europa...)' },
        { name: 'Sao Thổ', symbol: '♄', type: 'Hành tinh khí có vành đai lớn', color: '#fde047', glow: '#ca8a04', r: 14, dist: 275, speed: 0.034, hasRings: true, diameter: '116.460 km', distAu: '9.58 AU', period: '29,45 năm Trái Đất', moons: '146 vệ tinh (Titan, Enceladus...)' },
        { name: 'Sao Thiên Vương', symbol: '♅', type: 'Hành tinh băng khổng lồ', color: '#67e8f9', glow: '#0891b2', r: 11, dist: 325, speed: 0.012, diameter: '50.724 km', distAu: '19.22 AU', period: '84 năm Trái Đất', moons: '28 vệ tinh (Titania, Oberon...)' },
        { name: 'Sao Hải Vương', symbol: '♆', type: 'Hành tinh băng siêu gió bão', color: '#3b82f6', glow: '#1d4ed8', r: 10.5, dist: 370, speed: 0.006, diameter: '49.244 km', distAu: '30.05 AU', period: '164,8 năm Trái Đất', moons: '16 vệ tinh (Triton...)' }
      ];

      var stars = [];
      for (var s = 0; s < 250; s++) {
        stars.push({
          x: (Math.random() - 0.5) * 3000,
          y: (Math.random() - 0.5) * 3000,
          z: (Math.random() - 0.5) * 3000,
          size: Math.random() * 1.5 + 0.5,
          alpha: Math.random() * 0.7 + 0.3
        });
      }

      var camera = {
        rotX: 0.65,
        rotY: 0.4,
        zoom: 1.0,
        targetZoom: 1.0,
        panX: 0,
        panY: 0
      };

      var isPlaying = true;
      var speedMultiplier = 1.0;
      var showOrbits = true;
      var time = 0;
      var selectedPlanetIdx = 0;

      function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        ctx.scale(dpr, dpr);
      }
      window.addEventListener('resize', resize);
      resize();

      function updateInfoCard(idx) {
        var p = planets[idx];
        document.getElementById('infoName').textContent = p.name;
        document.getElementById('infoSymbol').textContent = p.symbol;
        document.getElementById('infoType').textContent = p.type;
        document.getElementById('infoDiameter').textContent = p.diameter;
        document.getElementById('infoDist').textContent = p.distAu;
        document.getElementById('infoPeriod').textContent = p.period;
        document.getElementById('infoMoons').textContent = p.moons;

        var pills = document.querySelectorAll('.planet-pill');
        pills.forEach(function(pill, i) {
          if (i === idx) pill.classList.add('active');
          else pill.classList.remove('active');
        });
      }

      var navContainer = document.getElementById('planetNav');
      planets.forEach(function(p, i) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'planet-pill' + (i === 0 ? ' active' : '');
        btn.textContent = p.name;
        btn.addEventListener('click', function() {
          selectedPlanetIdx = i;
          updateInfoCard(i);
        });
        navContainer.appendChild(btn);
      });

      var isDragging = false;
      var lastMouseX = 0;
      var lastMouseY = 0;

      canvas.addEventListener('pointerdown', function(e) {
        isDragging = true;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
        canvas.setPointerCapture(e.pointerId);
      });

      canvas.addEventListener('pointermove', function(e) {
        if (!isDragging) return;
        var dx = e.clientX - lastMouseX;
        var dy = e.clientY - lastMouseY;
        camera.rotY += dx * 0.005;
        camera.rotX = Math.max(0.1, Math.min(1.4, camera.rotX + dy * 0.005));
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
      });

      function stopDrag() { isDragging = false; }
      canvas.addEventListener('pointerup', stopDrag);
      canvas.addEventListener('pointercancel', stopDrag);

      canvas.addEventListener('wheel', function(e) {
        e.preventDefault();
        var delta = e.deltaY < 0 ? 1.1 : 0.9;
        camera.targetZoom = Math.max(0.4, Math.min(2.5, camera.targetZoom * delta));
      }, { passive: false });

      document.getElementById('btnPlayPause').addEventListener('click', function() {
        isPlaying = !isPlaying;
        this.textContent = isPlaying ? 'Tạm dừng' : 'Tiếp tục';
      });

      var speeds = [0.5, 1.0, 2.0, 5.0];
      var speedIdx = 1;
      document.getElementById('btnSpeed').addEventListener('click', function() {
        speedIdx = (speedIdx + 1) % speeds.length;
        speedMultiplier = speeds[speedIdx];
        this.textContent = 'Tốc độ: ' + speedMultiplier + 'x';
      });

      document.getElementById('btnResetView').addEventListener('click', function() {
        camera.rotX = 0.65;
        camera.rotY = 0.4;
        camera.targetZoom = 1.0;
      });

      document.getElementById('btnToggleOrbits').addEventListener('click', function() {
        showOrbits = !showOrbits;
        this.textContent = showOrbits ? 'Quỹ đạo: Bật' : 'Quỹ đạo: Tắt';
        if (showOrbits) this.classList.add('active');
        else this.classList.remove('active');
      });

      function project(x, y, z, cx, cy) {
        var cosY = Math.cos(camera.rotY);
        var sinY = Math.sin(camera.rotY);
        var x1 = x * cosY - z * sinY;
        var z1 = x * sinY + z * cosY;

        var cosX = Math.cos(camera.rotX);
        var sinX = Math.sin(camera.rotX);
        var y2 = y * cosX - z1 * sinX;
        var z2 = y * sinX + z1 * cosX;

        var fov = 700;
        var scale = (fov / (fov + z2 * 0.6)) * camera.zoom;
        return {
          px: cx + x1 * scale,
          py: cy + y2 * scale,
          scale: scale,
          depth: z2
        };
      }

      function draw() {
        var w = window.innerWidth;
        var h = window.innerHeight;
        var cx = w / 2;
        var cy = h / 2;

        camera.zoom += (camera.targetZoom - camera.zoom) * 0.1;

        if (isPlaying) {
          time += 0.015 * speedMultiplier;
        }

        ctx.fillStyle = '#05070d';
        ctx.fillRect(0, 0, w, h);

        for (var i = 0; i < stars.length; i++) {
          var st = stars[i];
          var sp = project(st.x, st.y, st.z, cx, cy);
          if (sp.px >= 0 && sp.px <= w && sp.py >= 0 && sp.py <= h) {
            ctx.fillStyle = 'rgba(255, 255, 255, ' + st.alpha + ')';
            ctx.beginPath();
            ctx.arc(sp.px, sp.py, Math.max(0.5, st.size * sp.scale * 0.5), 0, Math.PI * 2);
            ctx.fill();
          }
        }

        if (showOrbits) {
          for (var pIdx = 1; pIdx < planets.length; pIdx++) {
            var pl = planets[pIdx];
            ctx.strokeStyle = 'rgba(244, 241, 222, 0.07)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            var segments = 72;
            for (var seg = 0; seg <= segments; seg++) {
              var theta = (seg / segments) * Math.PI * 2;
              var ox = Math.cos(theta) * pl.dist;
              var oz = Math.sin(theta) * pl.dist;
              var pt = project(ox, 0, oz, cx, cy);
              if (seg === 0) ctx.moveTo(pt.px, pt.py);
              else ctx.lineTo(pt.px, pt.py);
            }
            ctx.stroke();
          }
        }

        var renderList = [];

        var sunGlowPt = project(0, 0, 0, cx, cy);
        renderList.push({
          type: 'sun',
          x: 0, y: 0, z: 0,
          proj: sunGlowPt,
          depth: sunGlowPt.depth,
          planet: planets[0]
        });

        for (var pi = 1; pi < planets.length; pi++) {
          var planet = planets[pi];
          var angle = time * planet.speed + pi;
          var px = Math.cos(angle) * planet.dist;
          var pz = Math.sin(angle) * planet.dist;
          var py = 0;
          var pt = project(px, py, pz, cx, cy);

          renderList.push({
            type: 'planet',
            x: px, y: py, z: pz,
            proj: pt,
            depth: pt.depth,
            planet: planet,
            index: pi,
            angle: angle
          });
        }

        renderList.sort(function(a, b) {
          return b.depth - a.depth;
        });

        for (var ri = 0; ri < renderList.length; ri++) {
          var item = renderList[ri];
          var pInfo = item.planet;
          var pr = item.proj;
          var scaledRadius = Math.max(2, pInfo.r * pr.scale * 0.45);

          if (item.type === 'sun') {
            var sunGrad = ctx.createRadialGradient(pr.px, pr.py, scaledRadius * 0.2, pr.px, pr.py, scaledRadius * 2.5);
            sunGrad.addColorStop(0, '#fff6d6');
            sunGrad.addColorStop(0.3, '#f59e0b');
            sunGrad.addColorStop(0.7, 'rgba(239, 68, 68, 0.4)');
            sunGrad.addColorStop(1, 'rgba(239, 68, 68, 0)');
            ctx.fillStyle = sunGrad;
            ctx.beginPath();
            ctx.arc(pr.px, pr.py, scaledRadius * 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffedd5';
            ctx.beginPath();
            ctx.arc(pr.px, pr.py, scaledRadius, 0, Math.PI * 2);
            ctx.fill();
          } else {
            if (pInfo.hasRings) {
              ctx.strokeStyle = 'rgba(253, 224, 71, 0.45)';
              ctx.lineWidth = Math.max(2, scaledRadius * 0.5);
              ctx.beginPath();
              ctx.ellipse(pr.px, pr.py, scaledRadius * 2.2, scaledRadius * 0.8, camera.rotY * 0.5, 0, Math.PI * 2);
              ctx.stroke();
            }

            var pGrad = ctx.createRadialGradient(
              pr.px - scaledRadius * 0.35,
              pr.py - scaledRadius * 0.35,
              scaledRadius * 0.1,
              pr.px,
              pr.py,
              scaledRadius
            );
            pGrad.addColorStop(0, '#ffffff');
            pGrad.addColorStop(0.4, pInfo.color);
            pGrad.addColorStop(1, pInfo.glow);

            ctx.fillStyle = pGrad;
            ctx.beginPath();
            ctx.arc(pr.px, pr.py, scaledRadius, 0, Math.PI * 2);
            ctx.fill();

            if (pInfo.hasMoon) {
              var mAngle = time * 8;
              var mDist = scaledRadius * 2.2;
              var mx = pr.px + Math.cos(mAngle) * mDist;
              var my = pr.py + Math.sin(mAngle) * mDist * 0.5;
              ctx.fillStyle = '#e2e8f0';
              ctx.beginPath();
              ctx.arc(mx, my, Math.max(1.5, scaledRadius * 0.28), 0, Math.PI * 2);
              ctx.fill();
            }

            if (item.index === selectedPlanetIdx) {
              ctx.strokeStyle = '#f2cc8f';
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              ctx.arc(pr.px, pr.py, scaledRadius + 6, 0, Math.PI * 2);
              ctx.stroke();
            }

            ctx.font = '10px -apple-system, BlinkMacSystemFont, sans-serif';
            ctx.fillStyle = item.index === selectedPlanetIdx ? '#f2cc8f' : 'rgba(244, 241, 222, 0.75)';
            ctx.textAlign = 'center';
            ctx.fillText(pInfo.name, pr.px, pr.py + scaledRadius + 14);
          }
        }

        requestAnimationFrame(draw);
      }

      draw();
    })();
  </script>
</body>
</html>
