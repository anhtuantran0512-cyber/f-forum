<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mô Phỏng Hệ Mặt Trời 3D · CLB Thiên Văn F-Forum</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020307;
      color: #FBF2E1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    #canvas3d {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    #canvas3d:active {
      cursor: grabbing;
    }
    .hud-header {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      pointer-events: none;
    }
    .hud-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #f2cc8f;
      display: flex;
      align-items: center;
      gap: 8px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }
    .hud-badge {
      display: inline-block;
      padding: 2px 6px;
      font-size: 10px;
      font-weight: 700;
      background: rgba(99, 102, 241, 0.25);
      border: 1px solid rgba(129, 140, 248, 0.5);
      border-radius: 6px;
      color: #a5b4fc;
    }
    .hud-sub {
      font-size: 11px;
      color: rgba(244, 241, 222, 0.7);
      margin-top: 3px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    }
    .hud-controls {
      position: absolute;
      bottom: 16px;
      left: 16px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(17, 21, 29, 0.85);
      border: 1.5px solid rgba(244, 241, 222, 0.16);
      padding: 6px 10px;
      border-radius: 14px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .hud-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #FBF2E1;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .hud-btn:hover {
      background: rgba(242, 204, 143, 0.2);
      border-color: #f2cc8f;
      color: #f2cc8f;
    }
    .hud-btn.active {
      background: #f2cc8f;
      color: #2B2331;
      border-color: #f2cc8f;
    }
    .info-card {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 10;
      width: 260px;
      background: rgba(17, 21, 29, 0.9);
      border: 1.5px solid rgba(244, 241, 222, 0.2);
      padding: 14px;
      border-radius: 16px;
      backdrop-filter: blur(14px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.6);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .info-planet-name {
      font-size: 16px;
      font-weight: 800;
      color: #f2cc8f;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .info-planet-type {
      font-size: 11px;
      color: rgba(244, 241, 222, 0.6);
      margin-top: 2px;
      margin-bottom: 8px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      padding: 4px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .info-label {
      color: rgba(244, 241, 222, 0.65);
    }
    .info-val {
      font-weight: 600;
      color: #fff;
    }
    .planet-nav {
      position: absolute;
      bottom: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      gap: 4px;
      overflow-x: auto;
      max-width: calc(100vw - 32px);
      background: rgba(17, 21, 29, 0.85);
      border: 1.5px solid rgba(244, 241, 222, 0.16);
      padding: 4px;
      border-radius: 12px;
      backdrop-filter: blur(12px);
    }
    .planet-pill {
      background: transparent;
      border: none;
      color: rgba(244, 241, 222, 0.7);
      padding: 5px 8px;
      font-size: 10.5px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .planet-pill:hover, .planet-pill.active {
      background: rgba(242, 204, 143, 0.2);
      color: #f2cc8f;
    }
    @media (max-width: 640px) {
      .info-card {
        top: auto;
        bottom: 64px;
        right: 16px;
        left: 16px;
        width: auto;
      }
      .planet-nav {
        bottom: 12px;
        right: 12px;
        left: 12px;
      }
      .hud-controls {
        bottom: 60px;
        left: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="hud-header">
    <div class="hud-title">
      <span>Trạm Khám Phá Thiên Văn 3D</span>
      <span class="hud-badge">Vật Lý Vũ Trụ</span>
    </div>
    <div class="hud-sub">Mô phỏng động học quỹ đạo Hệ Mặt Trời · F-Forum CLB Thiên Văn</div>
  </div>

  <div class="hud-controls">
    <button type="button" id="btnPlayPause" class="hud-btn">Tạm dừng</button>
    <button type="button" id="btnSpeed" class="hud-btn">Tốc độ: 1x</button>
    <button type="button" id="btnResetView" class="hud-btn">Góc nhìn chuẩn</button>
    <button type="button" id="btnToggleOrbits" class="hud-btn active">Quỹ đạo: Bật</button>
  </div>

  <div id="infoCard" class="info-card">
    <div class="info-planet-name">
      <span id="infoName">Mặt Trời</span>
      <span id="infoSymbol" style="font-size:18px;">☀️</span>
    </div>
    <div id="infoType" class="info-planet-type">Ngôi sao trung tâm · Hệ Mặt Trời</div>
    <div class="info-row">
      <span class="info-label">Đường kính</span>
      <span id="infoDiameter" class="info-val">1.392.700 km</span>
    </div>
    <div class="info-row">
      <span class="info-label">Khoảng cách</span>
      <span id="infoDist" class="info-val">0 AU (Tâm hệ)</span>
    </div>
    <div class="info-row">
      <span class="info-label">Chu kỳ quỹ đạo</span>
      <span id="infoPeriod" class="info-val">225 triệu năm</span>
    </div>
    <div class="info-row">
      <span class="info-label">Vệ tinh tự nhiên</span>
      <span id="infoMoons" class="info-val">8 hành tinh chính</span>
    </div>
  </div>

  <div class="planet-nav" id="planetNav"></div>

  <canvas id="canvas3d"></canvas>

  <script>
    (function() {
      var canvas = document.getElementById('canvas3d');
      var ctx = canvas.getContext('2d');

      var planets = [
        { id: 'sun', name: 'Mặt Trời', symbol: '☀️', type: 'Ngôi sao mẹ loại G2V', color: '#ffea75', glow: '#ea580c', r: 25, dist: 0, speed: 0, diameter: '1.392.700 km', distAu: '0 AU (Tâm hệ)', period: '225 triệu năm (Quanh tâm Ngân Hà)', moons: '8 hành tinh & vành đai Kuiper' },
        { id: 'mercury', name: 'Sao Thủy', symbol: '☿', type: 'Hành tinh đất đá', color: '#b0b5be', glow: '#4b5563', r: 4.8, dist: 58, speed: 4.15, diameter: '4.879 km', distAu: '0.39 AU', period: '88 ngày Trái Đất', moons: '0 vệ tinh' },
        { id: 'venus', name: 'Sao Kim', symbol: '♀', type: 'Hành tinh đất đá khí quyển CO2', color: '#f5d8a0', glow: '#b45309', r: 8.2, dist: 85, speed: 1.62, hasAtmo: true, atmoCol: 'rgba(251, 191, 36, 0.4)', diameter: '12.104 km', distAu: '0.72 AU', period: '224,7 ngày Trái Đất', moons: '0 vệ tinh' },
        { id: 'earth', name: 'Trái Đất', symbol: '🜨', type: 'Hành tinh sự sống & nước lỏng', color: '#2563eb', glow: '#1d4ed8', r: 9.4, dist: 122, speed: 1.0, hasMoon: true, hasAtmo: true, atmoCol: 'rgba(56, 189, 248, 0.65)', diameter: '12.742 km', distAu: '1.00 AU (149.6 triệu km)', period: '365,25 ngày Trái Đất', moons: '1 vệ tinh (Mặt Trăng)' },
        { id: 'mars', name: 'Sao Hỏa', symbol: '♂', type: 'Hành tinh Đỏ (Oxide sắt)', color: '#ea580c', glow: '#7c2d12', r: 6.2, dist: 160, speed: 0.53, hasAtmo: true, atmoCol: 'rgba(249, 115, 22, 0.35)', diameter: '6.779 km', distAu: '1.52 AU', period: '687 ngày Trái Đất', moons: '2 vệ tinh (Phobos, Deimos)' },
        { id: 'jupiter', name: 'Sao Mộc', symbol: '♃', type: 'Hành tinh khí khổng lồ', color: '#f59e0b', glow: '#78350f', r: 18.5, dist: 220, speed: 0.084, diameter: '139.820 km', distAu: '5.20 AU', period: '11,86 năm Trái Đất', moons: '95 vệ tinh (Ganymede, Europa...)' },
        { id: 'saturn', name: 'Sao Thổ', symbol: '♄', type: 'Hành tinh khí có vành đai lớn', color: '#eab308', glow: '#854d0e', r: 15.2, dist: 275, speed: 0.034, hasRings: true, diameter: '116.460 km', distAu: '9.58 AU', period: '29,45 năm Trái Đất', moons: '146 vệ tinh (Titan, Enceladus...)' },
        { id: 'uranus', name: 'Sao Thiên Vương', symbol: '♅', type: 'Hành tinh băng khổng lồ', color: '#38bdf8', glow: '#0369a1', r: 11.2, dist: 325, speed: 0.012, hasAtmo: true, atmoCol: 'rgba(56, 189, 248, 0.45)', diameter: '50.724 km', distAu: '19.22 AU', period: '84 năm Trái Đất', moons: '28 vệ tinh (Titania, Oberon...)' },
        { id: 'neptune', name: 'Sao Hải Vương', symbol: '♆', type: 'Hành tinh băng siêu gió bão', color: '#2563eb', glow: '#1e3a8a', r: 10.8, dist: 370, speed: 0.006, hasAtmo: true, atmoCol: 'rgba(96, 165, 250, 0.5)', diameter: '49.244 km', distAu: '30.05 AU', period: '164,8 năm Trái Đất', moons: '16 vệ tinh (Triton...)' }
      ];

      var stars = [];
      var spectralColors = ['#ffffff', '#f8fafc', '#93c5fd', '#fef08a', '#fdba74'];
      for (var s = 0; s < 380; s++) {
        stars.push({
          x: (Math.random() - 0.5) * 3200,
          y: (Math.random() - 0.5) * 3200,
          z: (Math.random() - 0.5) * 3200,
          size: Math.random() * 1.6 + 0.4,
          color: spectralColors[Math.floor(Math.random() * spectralColors.length)],
          alpha: Math.random() * 0.75 + 0.25,
          twinkle: Math.random() * Math.PI * 2
        });
      }

      var asteroids = [];
      for (var a = 0; a < 140; a++) {
        var aDist = 180 + Math.random() * 30;
        var aTheta = Math.random() * Math.PI * 2;
        asteroids.push({
          dist: aDist,
          theta: aTheta,
          speed: 0.18 + Math.random() * 0.04,
          y: (Math.random() - 0.5) * 14,
          size: Math.random() * 1.1 + 0.6,
          color: Math.random() > 0.5 ? '#94a3b8' : '#78716c'
        });
      }

      var camera = { rotX: 0.65, rotY: 0.4, zoom: 1.0, targetZoom: 1.0 };
      var isPlaying = true;
      var speedMultiplier = 1.0;
      var showOrbits = true;
      var time = 0;
      var selectedPlanetIdx = 0;

      function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        ctx.scale(dpr, dpr);
      }
      window.addEventListener('resize', resize);
      resize();

      function updateInfoCard(idx) {
        var p = planets[idx];
        document.getElementById('infoName').textContent = p.name;
        document.getElementById('infoSymbol').textContent = p.symbol;
        document.getElementById('infoType').textContent = p.type;
        document.getElementById('infoDiameter').textContent = p.diameter;
        document.getElementById('infoDist').textContent = p.distAu;
        document.getElementById('infoPeriod').textContent = p.period;
        document.getElementById('infoMoons').textContent = p.moons;
        var pills = document.querySelectorAll('.planet-pill');
        pills.forEach(function(pill, i) {
          if (i === idx) pill.classList.add('active');
          else pill.classList.remove('active');
        });
      }

      var navContainer = document.getElementById('planetNav');
      planets.forEach(function(p, i) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'planet-pill' + (i === 0 ? ' active' : '');
        btn.textContent = p.name;
        btn.addEventListener('click', function() {
          selectedPlanetIdx = i;
          updateInfoCard(i);
        });
        navContainer.appendChild(btn);
      });

      var isDragging = false;
      var lastMouseX = 0;
      var lastMouseY = 0;

      canvas.addEventListener('pointerdown', function(e) {
        isDragging = true;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
        canvas.setPointerCapture(e.pointerId);
      });

      canvas.addEventListener('pointermove', function(e) {
        if (!isDragging) return;
        var dx = e.clientX - lastMouseX;
        var dy = e.clientY - lastMouseY;
        camera.rotY += dx * 0.005;
        camera.rotX = Math.max(0.08, Math.min(1.48, camera.rotX + dy * 0.005));
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
      });

      function stopDrag() { isDragging = false; }
      canvas.addEventListener('pointerup', stopDrag);
      canvas.addEventListener('pointercancel', stopDrag);

      canvas.addEventListener('wheel', function(e) {
        e.preventDefault();
        var delta = e.deltaY < 0 ? 1.1 : 0.9;
        camera.targetZoom = Math.max(0.4, Math.min(2.8, camera.targetZoom * delta));
      }, { passive: false });

      document.getElementById('btnPlayPause').addEventListener('click', function() {
        isPlaying = !isPlaying;
        this.textContent = isPlaying ? 'Tạm dừng' : 'Tiếp tục';
      });

      var speeds = [0.5, 1.0, 2.0, 5.0];
      var speedIdx = 1;
      document.getElementById('btnSpeed').addEventListener('click', function() {
        speedIdx = (speedIdx + 1) % speeds.length;
        speedMultiplier = speeds[speedIdx];
        this.textContent = 'Tốc độ: ' + speedMultiplier + 'x';
      });

      document.getElementById('btnResetView').addEventListener('click', function() {
        camera.rotX = 0.65;
        camera.rotY = 0.4;
        camera.targetZoom = 1.0;
      });

      document.getElementById('btnToggleOrbits').addEventListener('click', function() {
        showOrbits = !showOrbits;
        this.textContent = showOrbits ? 'Quỹ đạo: Bật' : 'Quỹ đạo: Tắt';
        if (showOrbits) this.classList.add('active');
        else this.classList.remove('active');
      });

      function project(x, y, z, cx, cy) {
        var cosY = Math.cos(camera.rotY);
        var sinY = Math.sin(camera.rotY);
        var x1 = x * cosY - z * sinY;
        var z1 = x * sinY + z * cosY;
        var cosX = Math.cos(camera.rotX);
        var sinX = Math.sin(camera.rotX);
        var y2 = y * cosX - z1 * sinX;
        var z2 = y * sinX + z1 * cosX;
        var fov = 720;
        var scale = (fov / (fov + z2 * 0.6)) * camera.zoom;
        return { px: cx + x1 * scale, py: cy + y2 * scale, scale: scale, depth: z2 };
      }

      function drawPhotorealisticPlanet(pInfo, pr, r, sunPr, pTime) {
        var dx = pr.px - sunPr.px;
        var dy = pr.py - sunPr.py;
        var lightAngle = Math.atan2(-dy, -dx);
        var hx = pr.px + Math.cos(lightAngle) * (r * 0.42);
        var hy = pr.py + Math.sin(lightAngle) * (r * 0.42);
        ctx.save(); ctx.beginPath();
        ctx.arc(pr.px, pr.py, r, 0, Math.PI * 2); ctx.clip();
        ctx.fillStyle = '#05070d';
        ctx.fillRect(pr.px - r, pr.py - r, r * 2, r * 2);
        var sphereGrad = ctx.createRadialGradient(hx, hy, r * 0.05, pr.px, pr.py, r * 1.05);
        sphereGrad.addColorStop(0, '#ffffff');
        sphereGrad.addColorStop(0.3, pInfo.color);
        sphereGrad.addColorStop(0.75, pInfo.glow);
        sphereGrad.addColorStop(1, '#05070d');
        ctx.fillStyle = sphereGrad; ctx.beginPath();
        ctx.arc(pr.px, pr.py, r, 0, Math.PI * 2); ctx.fill();
        if (pInfo.id === 'earth') { ctx.save();
          ctx.fillStyle = 'rgba(34, 197, 94, 0.65)'; ctx.beginPath();
          ctx.ellipse(pr.px - r * 0.1, pr.py - r * 0.1, r * 0.45, r * 0.35, 0.4, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = 'rgba(74, 222, 128, 0.55)'; ctx.beginPath();
          ctx.ellipse(pr.px + r * 0.32, pr.py + r * 0.15, r * 0.28, r * 0.45, -0.3, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = 'rgba(255, 255, 255, 0.88)'; ctx.beginPath();
          ctx.ellipse(pr.px, pr.py - r * 0.86, r * 0.45, r * 0.14, 0, 0, Math.PI * 2);
          ctx.ellipse(pr.px, pr.py + r * 0.86, r * 0.4, r * 0.14, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = 'rgba(255, 255, 255, 0.38)'; ctx.beginPath();
          ctx.arc(pr.px - r * 0.25, pr.py + r * 0.1, r * 0.28, 0, Math.PI * 2);
          ctx.arc(pr.px + r * 0.22, pr.py - r * 0.2, r * 0.22, 0, Math.PI * 2);
          ctx.fill(); ctx.restore();
        } else if (pInfo.id === 'jupiter') {
          var jBands = [
            { y: -0.65, h: 0.12, c: 'rgba(154, 78, 46, 0.85)' },
            { y: -0.45, h: 0.16, c: 'rgba(224, 185, 142, 0.7)' },
            { y: -0.22, h: 0.18, c: 'rgba(180, 84, 45, 0.9)' },
            { y: 0.05, h: 0.16, c: 'rgba(235, 205, 168, 0.65)' },
            { y: 0.28, h: 0.22, c: 'rgba(165, 75, 40, 0.9)' },
            { y: 0.58, h: 0.14, c: 'rgba(135, 60, 32, 0.8)' }
          ];
          jBands.forEach(function(b) {
            ctx.fillStyle = b.c;
            ctx.fillRect(pr.px - r, pr.py + r * b.y, r * 2, r * b.h);
          });
          var grsX = pr.px + Math.cos(pTime * 0.35) * r * 0.45;
          var grsY = pr.py + r * 0.34;
          ctx.fillStyle = 'rgba(185, 28, 28, 0.9)'; ctx.beginPath();
          ctx.ellipse(grsX, grsY, r * 0.26, r * 0.14, 0.05, 0, Math.PI * 2); ctx.fill();
        } else if (pInfo.id === 'mars') {
          ctx.fillStyle = 'rgba(127, 29, 29, 0.65)'; ctx.beginPath();
          ctx.ellipse(pr.px + r * 0.15, pr.py + r * 0.1, r * 0.45, r * 0.28, 0.25, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = 'rgba(255, 255, 255, 0.92)'; ctx.beginPath();
          ctx.ellipse(pr.px, pr.py - r * 0.85, r * 0.38, r * 0.14, 0, 0, Math.PI * 2); ctx.fill();
        } else if (pInfo.id === 'saturn') {
          var sBands = [
            { y: -0.4, h: 0.16, c: 'rgba(202, 138, 4, 0.6)' },
            { y: -0.1, h: 0.2, c: 'rgba(253, 224, 71, 0.4)' },
            { y: 0.2, h: 0.2, c: 'rgba(161, 98, 7, 0.65)' }
          ];
          sBands.forEach(function(b) {
            ctx.fillStyle = b.c;
            ctx.fillRect(pr.px - r, pr.py + r * b.y, r * 2, r * b.h);
          });
        }
        var terminator = ctx.createLinearGradient(
          pr.px + Math.cos(lightAngle) * r,
          pr.py + Math.sin(lightAngle) * r,
          pr.px - Math.cos(lightAngle) * r,
          pr.py - Math.sin(lightAngle) * r
        );
        terminator.addColorStop(0, 'rgba(0,0,0,0)');
        terminator.addColorStop(0.48, 'rgba(0,0,0,0.08)');
        terminator.addColorStop(0.7, 'rgba(0,0,0,0.72)');
        terminator.addColorStop(0.9, 'rgba(0,0,0,0.96)');
        terminator.addColorStop(1, 'rgba(0,0,0,0.99)');
        ctx.fillStyle = terminator; ctx.beginPath();
        ctx.arc(pr.px, pr.py, r + 0.5, 0, Math.PI * 2);
        ctx.fill(); ctx.restore();
        if (pInfo.hasAtmo) {
          var atmoGrad = ctx.createRadialGradient(hx, hy, r * 0.85, pr.px, pr.py, r * 1.25);
          atmoGrad.addColorStop(0, pInfo.atmoCol);
          atmoGrad.addColorStop(0.5, 'rgba(0,0,0,0.1)');
          atmoGrad.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = atmoGrad; ctx.beginPath();
          ctx.arc(pr.px, pr.py, r * 1.25, 0, Math.PI * 2); ctx.fill();
        }
      }

      function draw() {
        var w = window.innerWidth;
        var h = window.innerHeight;
        var cx = w / 2;
        var cy = h / 2;
        camera.zoom += (camera.targetZoom - camera.zoom) * 0.1;
        if (isPlaying) {
          time += 0.015 * speedMultiplier;
        }
        ctx.fillStyle = '#020307';
        ctx.fillRect(0, 0, w, h);
        var bgNebula = ctx.createRadialGradient(cx, cy, 50, cx, cy, w * 0.8);
        bgNebula.addColorStop(0, 'rgba(15, 23, 42, 0.45)');
        bgNebula.addColorStop(0.6, 'rgba(2, 6, 23, 0.3)');

rStop(0.8, 'rgba(220, 38, 38, 0.2)'); coronaGrad.addColorStop(1, 'rgba(0, 0, 0, 0)'); ctx.fillStyle = coronaGrad; ctx.beginPath(); ctx.arc(pr.px, pr.py, scaledRadius * 3.6, 0, Math.PI * 2); ctx.fill(); for (var f = 0; f < 12; f++) { var fAngle = f * (Math.PI / 6) + time * 0.5; var fLen = scaledRadius * (1.8 + Math.sin(time * 4 + f) * 0.4); ctx.strokeStyle = 'rgba(251, 191, 36, 0.45)'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(pr.px, pr.py); ctx.lineTo(pr.px + Math.cos(fAngle) * fLen, pr.py + Math.sin(fAngle) * fLen); ctx.stroke(); } var coreSun = ctx.createRadialGradient(pr.px - scaledRadius * 0.2, pr.py - scaledRadius * 0.2, scaledRadius * 0.1, pr.px, pr.py, scaledRadius); coreSun.addColorStop(0, '#ffffff'); coreSun.addColorStop(0.4, '#fef08a'); coreSun.addColorStop(0.8, '#f59e0b'); coreSun.addColorStop(1, '#b45309');
